name: release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: version-2-json-bridge

env:
  # @vscode/test-electron 3.x needs Node 22.
  NODE_VERSION: "22"

jobs:
  # The patch component of the version is the number of the PR that introduces
  # the change (0.2.<PR>), the same scheme as glean-code-cli. It cannot be known
  # until the PR is opened, so this job is what stops it silently rotting.
  version:
    name: version matches the PR number
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check 0.2.<PR>
        env:
          PR: ${{ github.event.pull_request.number }}
        run: |
          have=$(node -p "require('./package.json').version")
          lock=$(node -p "require('./package-lock.json').version")
          want="0.2.$PR"
          if [ "$have" != "$want" ] || [ "$lock" != "$want" ]; then
            echo "::error::package.json is $have and package-lock.json is $lock, but this is PR #$PR, so both must be $want"
            echo "Fix it with:  node tools/set_version.mjs $PR"
            exit 1
          fi
          echo "version $have matches PR #$PR"

  # The bridge must run on the CLI's Python floor (3.9, what macOS ships) as
  # well as current Python. No VS Code needed: speak the JSON protocol directly.
  bridge:
    name: bridge on python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Fetch the pinned CLI
        run: node scripts/bundle-cli.mjs --release

      - name: Round-trip status, search and chat in mock mode
        env:
          PYTHONPATH: bundled/glean-code.pyz
          PYTHONPYCACHEPREFIX: ${{ runner.temp }}/pycache
        run: |
          printf '%s\n' \
            '{"id":"1","method":"status","params":{}}' \
            '{"id":"2","method":"search","params":{"query":"checkout incident","page_size":2}}' \
            '{"id":"3","method":"chat","params":{"message":"who owned the fix?"}}' \
            | python -u python/glean_bridge.py > "$RUNNER_TEMP/out.jsonl"
          python - "$RUNNER_TEMP/out.jsonl" <<'EOF'
          import json, sys
          lines = [json.loads(l) for l in open(sys.argv[1])]
          by_id = {l["id"]: l for l in lines if "id" in l}
          assert lines[0].get("event") == "ready", lines[0]
          assert by_id["1"]["result"]["mode"] == "mock", by_id["1"]
          assert by_id["2"]["result"]["results"], by_id["2"]
          assert by_id["3"]["result"]["text"], by_id["3"]
          print(f"bridge OK on Python {sys.version.split()[0]}: {len(by_id)} responses")
          EOF

  test:
    name: integration test on VS Code ${{ matrix.vscode }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # stable, plus the floor package.json claims in engines.vscode.
        vscode: ["stable", "1.85.0"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: version-2-json-bridge/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: npm ci
      - name: Fetch the pinned CLI
        run: npm run bundle:cli:release
      - run: npm run compile

      - name: Run the integration test
        env:
          VSCODE_VERSION: ${{ matrix.vscode }}
          PYTHONPYCACHEPREFIX: ${{ runner.temp }}/pycache
        run: xvfb-run -a npm run test:ci

  # v1 is kept as a reference; it is not released, but it must keep compiling.
  v1:
    name: version-1-repl compiles
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: version-1-repl
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm ci
      - run: npx tsc -p ./ --noEmit

  package:
    name: package the .vsix
    needs: [bridge, test, v1]
    runs-on: ubuntu-latest
    outputs:
      vsix: ${{ steps.pack.outputs.vsix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: version-2-json-bridge/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: npm ci

      # vscode:prepublish runs bundle:cli; GLEAN_CLI_RELEASE makes it download
      # the release pinned in cli-release.txt instead of looking for a checkout.
      - name: Package
        id: pack
        env:
          GLEAN_CLI_RELEASE: pinned
          PYTHONPYCACHEPREFIX: ${{ runner.temp }}/pycache
        run: |
          npm run package
          vsix=$(ls dist/*.vsix)
          echo "vsix=$(basename "$vsix")" >> "$GITHUB_OUTPUT"
          echo "built $vsix ($(du -h "$vsix" | cut -f1))"

      - name: Check what the .vsix carries
        run: |
          vsix=$(ls dist/*.vsix)
          listing=$(unzip -l "$vsix")
          for f in extension/bundled/glean-code.pyz extension/python/glean_bridge.py extension/out/extension.js; do
            echo "$listing" | grep "$f" >/dev/null || { echo "::error::$f missing from $vsix"; exit 1; }
          done
          if echo "$listing" | grep -E 'extension/(out/test/|src/|node_modules/)' >/dev/null; then
            echo "::error::dev-only files leaked into $vsix"; exit 1
          fi
          pinned=$(sed 's/^v//' cli-release.txt)
          shipped=$(unzip -p "$vsix" extension/bundled/cli-version.json | node -p "JSON.parse(require('fs').readFileSync(0)).version")
          if [ "$shipped" != "$pinned" ]; then
            echo "::error::.vsix bundles glean_code $shipped but cli-release.txt pins $pinned"; exit 1
          fi
          echo "bundles glean_code $shipped, as pinned"

      - name: Confirm the build left no artifacts in the tree
        working-directory: .
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::working tree dirty after build"; git status --short; exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: version-2-json-bridge/dist/*.vsix
          if-no-files-found: error

  # A tag is the release marker; the version is the per-PR build identity.
  # `git push origin v0.2.N` turns the tested .vsix into a GitHub Release.
  publish:
    name: publish ${{ github.ref_name }}
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write        # required to create a release
      id-token: write        # required for Open VSX trusted publishing
    steps:
      - uses: actions/checkout@v4

      - name: Refuse to publish a tag that disagrees with package.json
        env:
          TAG: ${{ github.ref_name }}
        run: |
          have=$(node -p "require('./package.json').version")
          if [ "$have" != "${TAG#v}" ]; then
            echo "::error::tag $TAG does not match package.json version $have"
            exit 1
          fi
          echo "tag $TAG matches package.json $have"

      - uses: actions/download-artifact@v4
        with:
          name: vsix
          path: ${{ runner.temp }}/vsix

      # Open VSX is the primary registry: it is what VSCodium, Cursor and other
      # non-Microsoft builds read, and it has no corporate gate.
      #
      # Two ways in. A PAT in OVSX_TOKEN is the simple one. Trusted publishing
      # exchanges a short-lived OIDC token instead, so there is no long-lived
      # secret to leak or rotate — but it only works once the namespace on
      # open-vsx.org is configured to trust this repository, so it is opt-in via
      # the OVSX_TRUSTED repository variable.
      #
      # With neither configured this skips with a notice: a release tag must not
      # fail for want of a registry credential.
      - name: Publish to Open VSX
        env:
          OVSX_TOKEN: ${{ secrets.OVSX_TOKEN }}
          OVSX_TRUSTED: ${{ vars.OVSX_TRUSTED }}
          VSIX: ${{ runner.temp }}/vsix/${{ needs.package.outputs.vsix }}
        run: |
          if [ -n "${OVSX_TOKEN}" ]; then
            echo "publishing with a personal access token"
            npx --yes ovsx publish "${VSIX}" --pat "${OVSX_TOKEN}" --skip-duplicate
          elif [ "${OVSX_TRUSTED}" = "true" ]; then
            echo "publishing with OIDC trusted publishing"
            npx --yes ovsx publish "${VSIX}" --trusted-publishing --skip-duplicate
          else
            echo "::notice::Open VSX publish skipped — no credential configured."
            echo "One-time setup, either:"
            echo "  PAT      sign in at https://open-vsx.org, accept the Eclipse"
            echo "           Publisher Agreement, run 'npx ovsx create-namespace barkz',"
            echo "           then add the token as the OVSX_TOKEN secret."
            echo "  trusted  configure this repo as a trusted publisher for the"
            echo "           barkz namespace, then set the OVSX_TRUSTED variable to true."
            exit 0
          fi
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VSIX: ${{ runner.temp }}/vsix/${{ needs.package.outputs.vsix }}
        run: |
          cli=$(cat cli-release.txt)
          gh release create "$TAG" "$VSIX" \
            --title "Glean Code extension $TAG" \
            --notes "Bundles [glean-code-cli $cli](https://github.com/barkz/glean-code-cli/releases/tag/$cli).

          Install: \`code --install-extension $(basename "$VSIX")\` (or Cursor / VSCodium: \`cursor --install-extension\`, \`codium --install-extension\`)." \
            --generate-notes \
            --verify-tag
